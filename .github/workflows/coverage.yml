name: Lab 6 coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -r requirements.txt
      - name: Line coverage
        run: |
          coverage run -m pytest CodeCoverageTest_car_rental_rate_application.py
          coverage report -m | tee line_coverage_report.txt
      - name: Branch coverage
        run: |
          coverage erase
          coverage run --branch -m pytest BranchCoverageTest_car_rental_rate_application.py
          coverage report -m | tee branch_coverage_report.txt
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab6-coverage-reports
          path: |
            Lab 6/line_coverage_report.txt
            Lab 6/branch_coverage_report.txt

